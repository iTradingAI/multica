# Downstream-only: build Desktop installers for this fork's releases.
#
# The upstream release.yml gates its `desktop` job behind the upstream
# `release` job (owner-check), so forks get no installers from it. This
# workflow fills that gap: on a version tag it packages unsigned Linux,
# Windows and macOS installers and attaches them to the tag's GitHub Release.
#
# macOS builds have no Developer ID signing or notarization. First launch
# may require right-click > Open in Gatekeeper. Apple credentials (option 2)
# remain an owner decision; no credentials are needed for these builds.
# PR/manual runs only retain workflow artifacts and never publish a release.

name: Desktop release (fork)

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-dirty*"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fork-desktop-release.yml
      - scripts/fork-release/publish-desktop.py
      - scripts/fork-release/linux_appimage_abi.py
      - scripts/fork-release/extract-release-asar.cjs
      - scripts/fork-release/smoke-linux-appimage.sh
      - apps/desktop/scripts/package.mjs
      - apps/desktop/scripts/bundle-cli.mjs
      - apps/desktop/electron-builder.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: github.repository == 'iTradingAI/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: x64
          # NOT windows-latest: the windows-2025 image no longer exposes a
          # Visual Studio instance node-gyp can find, so the node-pty
          # rebuild during install-app-deps fails with "Could not find any
          # Visual Studio installation". windows-2022 ships a full VS 2022
          # C++ toolchain that node-gyp detects.
          - os: windows-2022
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (full history for git describe versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux packaging and AppImage verification tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils xvfb xauth xdotool libfuse2t64 libdbusmenu-gtk3-4 libdbus-glib-1-2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ matrix.target != 'linux' && 'pnpm' || '' }}

      - name: Set up MSVC environment (Windows)
        if: matrix.target == 'win'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        if: matrix.target != 'linux'
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies from a clean store
        if: matrix.target == 'linux'
        shell: bash
        run: |
          test ! -e node_modules
          test ! -e apps/desktop/node_modules
          test ! -e "$RUNNER_TEMP/pnpm-linux-x64-noble"
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-linux-x64-noble" --config.side-effects-cache=false

      - name: Package Desktop installers
        working-directory: apps/desktop
        env:
          # Same unsigned-build posture as upstream's CI desktop job.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # --publish never is load-bearing: on tag-triggered CI runs
        # electron-builder's default publish policy attempts a GitHub
        # Release upload, which fails without GH_TOKEN. The explicit
        # upload steps below handle publishing instead.
        # The legacy AppImage toolset bundles GTK2 tray libraries whose
        # libdbusmenu-gtk.so.4 dependency is unavailable on Ubuntu 24.04.
        run: >-
          node scripts/package.mjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
          ${{ matrix.target == 'linux' && '-c.toolsets.appimage=1.0.2' || '' }}

      - name: Verify macOS installers and update metadata
        if: matrix.target == 'mac'
        shell: bash
        working-directory: apps/desktop
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(dist/multica-desktop-*-mac-"$ARCH".dmg)
          zip=(dist/multica-desktop-*-mac-"$ARCH".zip)
          test "${#dmg[@]}" -eq 1
          test "${#zip[@]}" -eq 1
          metadata=dist/latest-mac.yml
          if [ "$ARCH" = x64 ]; then metadata=dist/latest-x64-mac.yml; fi
          test -s "$metadata"

      - name: Record source revision
        shell: bash
        run: git rev-parse HEAD > apps/desktop/dist/build-revision

      - name: Verify the exact Linux AppImage and its update metadata
        if: matrix.target == 'linux'
        id: linux-abi
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/linux-abi-env"
          python="$RUNNER_TEMP/linux-abi-env/bin/python"
          "$python" -m pip install PyYAML==6.0.3
          "$python" scripts/fork-release/linux_appimage_abi.py scan apps/desktop/dist "$GITHUB_SHA"
          "$python" scripts/fork-release/linux_appimage_abi.py verify apps/desktop/dist "$GITHUB_SHA"

      - name: Retain verified Linux installers and update metadata
        if: matrix.target == 'linux' && steps.linux-abi.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/dist/multica-desktop-*.AppImage
            apps/desktop/dist/multica-desktop-*.deb
            apps/desktop/dist/multica-desktop-*.rpm
            apps/desktop/dist/latest-linux.yml
            apps/desktop/dist/build-revision
            apps/desktop/dist/linux-appimage-abi.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Retain installers and update metadata
        if: matrix.target != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/multica-desktop-*
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/build-revision
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    # A manual run on a tag is still a dry run. Only tag pushes publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fork-desktop-release-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
      - name: Verify and publish complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/release-env"
          "$RUNNER_TEMP/release-env/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/release-env/bin/python" scripts/fork-release/publish-desktop.py dist
