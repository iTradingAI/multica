# Downstream-only: propose merges; never write main or auto-merge a PR.
name: Fork sync (upstream candidate)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  propose-upstream:
    if: github.repository == 'iTradingAI/multica' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare candidate and request validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Bash reads incrementally: merging must not replace the privileged
          # script while it is still running.
          cp scripts/fork-sync.sh "$RUNNER_TEMP/fork-sync.sh"
          bash "$RUNNER_TEMP/fork-sync.sh"

      - name: Preserve merge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-sync-diagnostics
          if-no-files-found: ignore
          retention-days: 30
